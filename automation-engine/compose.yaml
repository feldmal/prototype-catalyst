services:
  automation-api:
    build: .
    container_name: prototype-catalyst-automation
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /service/data
      MAX_UPLOAD_MB: "25"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_MAX_UPLOAD_MB: ${R2_MAX_UPLOAD_MB:-1024}
      R2_UPLOAD_API_TOKEN: ${R2_UPLOAD_API_TOKEN:-}
    volumes:
      - automation_data:/service/data
    restart: unless-stopped

volumes:
  automation_data:
