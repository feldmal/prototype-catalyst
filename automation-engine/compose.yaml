services:
  automation-api:
    build: .
    container_name: prototype-catalyst-automation
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /service/data
      MAX_UPLOAD_MB: "25"
    volumes:
      - automation_data:/service/data
    restart: unless-stopped

volumes:
  automation_data:
